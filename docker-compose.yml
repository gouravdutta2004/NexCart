services:
  # MongoDB 7 Replica Set (Required for ACID Transactions)
  mongodb:
    image: mongo:7.0
    container_name: nexcart-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-time Replica Set Initializer
  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
        }
      '

  # NexCart Backend API & WebSocket Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexcart-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/nexcart_db?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy

  # NexCart Frontend SPA (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api/v1
    container_name: nexcart-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
